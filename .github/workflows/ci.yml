name: CI

# Restores, builds (warnings as errors), checks formatting, runs the whole test suite and packs Tynab.YANLib
# (package validation against the latest published version, set in YANLib.csproj). Nothing is published here: the Publish workflow (publish.yml)
# calls this workflow for a version tag and pushes the package it produces.

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and pack
    # Linux: the YANProcess tests start copies of /bin/sleep.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The package icon (res/icon.png) is stored in Git LFS; without lfs: true the 130-byte pointer file would be packed.
      - name: Check out
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      # CI pins the latest .NET 8 SDK (8.0.100 with rollForward latestFeature) with a global.json written here, not committed,
      # so contributors can build with any SDK. Without the pin the runner's newest preinstalled SDK would be used, and the
      # formatter output depends on the SDK version.
      - name: Pin the .NET 8 SDK
        run: |
          echo '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET SDK
        run: dotnet --version

      # TreatWarningsAsErrors instead of -warnaserror: Directory.Build.props keeps the NuGet audit warnings
      # NU1900-NU1905 as warnings only for the property (see the comment there). Restore uses the repository's NuGet.Config.
      - name: Restore
        run: dotnet restore YANLib.sln -p:TreatWarningsAsErrors=true

      - name: Build
        run: dotnet build YANLib.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Check formatting
        run: dotnet format YANLib.sln --verify-no-changes --no-restore

      # The whole suite, no filter: any failed test (or a crashed test host) fails the step.
      - name: Test
        id: test
        timeout-minutes: 15
        run: >-
          dotnet test YANLib.sln -c Release --no-build -p:TreatWarningsAsErrors=true
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # Package validation runs after the .nupkg is written, so a failed pack still leaves a package in the folder;
      # the upload below runs only when this step succeeded.
      - name: Pack
        run: dotnet pack lib/YANLib/YANLib.csproj -c Release --no-build -o artifacts/package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/package/*.nupkg
          if-no-files-found: error
